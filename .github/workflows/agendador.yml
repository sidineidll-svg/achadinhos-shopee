name: Postar produtos automaticamente

on:
  schedule:
    - cron: "0 12 * * *"   # todo dia às 12:00 UTC (ajuste como quiser)
  workflow_dispatch: {}    # permite rodar manualmente pelo botão "Run workflow"

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests google-generativeai

      - name: Rodar script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python atualizar_site.py
